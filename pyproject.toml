[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffl-p2p"
version = "0.2.6"
description = "Native P2P connectivity for FastFileLink"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ffl_p2p = ["_ffl_p2p*.so", "_ffl_p2p*.pyd", "_ffl_p2p*.dylib"]
